<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웹소설 스타일 캡처 생성기</title>
  <!-- 고화질 이미지 저장을 위한 라이브러리 로드 -->
  <script src="[https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js](https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js)"></script>
  <!-- 완전한 마크다운 파싱을 위한 Marked.js 라이브러리 로드 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>

  <style>
    /* 기본 레이아웃 변수 설정 (라이트/다크 모드대응) */
    :root {
      --bg-control: #f8f9fa;
      --text-control: #333;
      --border-color: #ced4da;
      
      /* 캡처 본문 스타일 (기본 다크모드) */
      --novel-bg: #141413;
      --novel-text: #fafafa;        
      --novel-bold: #fafafa;        
      --novel-highlight-text: #ffeb3b; 
      --novel-code-bg: rgba(255, 255, 255, 0.12); 
      
      --novel-bar-color: rgba(255, 255, 255, 0.25); 
      --novel-text-low: rgba(255, 255, 255, 0.55);    
      
      /* 기본 행간 및 여백 설정 */
      --novel-line-height: 1.85;
      --novel-padding-v: 40px;
      --novel-padding-h: 40px;
    }

    [data-theme="light"] {
      --novel-bg: #ffffff;
      --novel-text: #000000;        
      --novel-bold: #000000;
      --novel-highlight-text: #b45309; 
      --novel-code-bg: rgba(0, 0, 0, 0.06); 
      
      --novel-bar-color: rgba(0, 0, 0, 0.18);        
      --novel-text-low: rgba(0, 0, 0, 0.48);         
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; 
      display: flex; 
      height: 100vh; 
      background: #e9ecef; 
    }

    /* 컨트롤 패널 스타일 (좌측) */
    .control-panel { width: 400px; padding: 20px; background: var(--bg-control); color: var(--text-control); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
    h2 { font-size: 18px; margin-bottom: 5px; }
    label { font-size: 13px; font-weight: bold; display: block; }
    textarea, input[type="text"] { width: 100%; border: 1px solid var(--border-color); padding: 10px; border-radius: 4px; font-size: 14px; resize: none; }
    
    input[type="range"] { width: 100%; margin-top: 5px; cursor: pointer; }

    .btn { width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; }
    .btn-primary { background: #007bff; color: white; }
    .btn-primary:hover { background: #0056b3; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-secondary:hover { background: #5a6268; }
    .btn-success { background: #28a745; color: white; margin-top: auto; }
    .btn-success:hover { background: #218838; }
    .flex-row { display: flex; gap: 10px; align-items: center; }
    .guide-box { background: #e2e3e5; padding: 10px; border-radius: 4px; font-size: 12px; line-height: 1.5; color: #383d41; }

    /* 프리뷰 영역 스타일 (우측) */
    .preview-container { flex: 1; display: flex; justify-content: center; align-items: start; padding: 20px; overflow-y: auto; background: #555; position: relative; }
    
    /* 실제 웹소설 캡처 구역 */
    .novel-capture-area {
      width: 500px; 
      min-height: 700px;
      background-color: var(--novel-bg);
      padding: var(--novel-padding-v) var(--novel-padding-h); 
      color: var(--novel-text);
      font-size: 17px;
      line-height: var(--novel-line-height); 
      letter-spacing: -0.02em;
      text-align: left; 
    }

    /* 문단 간격 및 행간 설정 */
    .novel-capture-area p {
      word-break: keep-all;
      overflow-wrap: break-word;
      margin: 0; 
      color: var(--novel-text);
      line-height: var(--novel-line-height);
    }

    /* 빈 줄(엔터) 정확한 높이 보장 */
    .novel-capture-area p.empty-line {
      margin: 0;
      min-height: calc(1em * var(--novel-line-height));
    }

    /* 헤더 스타일링 */
    .novel-capture-area h1, .novel-capture-area h2, .novel-capture-area h3,
    .novel-capture-area h4, .novel-capture-area h5, .novel-capture-area h6 {
      color: var(--novel-bold);
      margin-top: 0.8em;
      margin-bottom: 0.4em;
      line-height: 1.3;
    }
    .novel-capture-area h1 { font-size: 1.8em; border-bottom: 1px solid var(--novel-bar-color); padding-bottom: 0.3em; }
    .novel-capture-area h2 { font-size: 1.5em; border-bottom: 1px solid var(--novel-bar-color); padding-bottom: 0.3em; }
    .novel-capture-area h3 { font-size: 1.3em; }
    .novel-capture-area h4 { font-size: 1.15em; }
    .novel-capture-area h5 { font-size: 1em; }
    .novel-capture-area h6 { font-size: 0.85em; opacity: 0.8; }

    /* 블록 요소 상하 여백 */
    .novel-capture-area ul,
    .novel-capture-area ol,
    .novel-capture-area table,
    .novel-capture-area pre,
    .novel-capture-area blockquote {
      margin-top: 0.6em;
      margin-bottom: 0.8em;
    }

    /* 구분선 */
    .novel-capture-area hr {
      border: none;
      border-top: 1px solid var(--novel-bar-color);
      margin: 1.5em 0;
    }

    /* 마크다운 기본 인라인 서식 정의 */
    .novel-capture-area strong { 
      color: var(--novel-bold); 
      font-weight: 700; 
    }
    
    /* 이탤릭(*text*) 서식 변경: 기울임 제거 & 색상 #85837d 변경 */
    .novel-capture-area em {
      font-style: normal;
      color: #85837d;
    }

    .novel-capture-area del {
      text-decoration: line-through;
      opacity: 0.7;
    }

    .novel-capture-area u {
      text-decoration: underline;
    }

    .novel-capture-area .low-opacity { 
      color: var(--novel-text-low) !important;
    }
    
    /* 인용구 스타일 */
    .novel-capture-area blockquote { 
      border-left: 4px solid var(--novel-bar-color); 
      padding-left: 15px; 
      margin-left: 0;
      margin-right: 0;
      opacity: 0.9;
    }
    
    /* 리스트 스타일 */
    .novel-capture-area ul, .novel-capture-area ol {
      padding-left: 1.5em;
    }
    .novel-capture-area li {
      margin-bottom: 0.3em;
    }
    .novel-capture-area input[type="checkbox"] {
      margin-right: 0.5em;
    }

    /* 링크 및 이미지 */
    .novel-capture-area a {
      color: #64b5f6;
      text-decoration: underline;
    }
    [data-theme="light"] .novel-capture-area a {
      color: #1976d2;
    }
    .novel-capture-area img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      margin: 0.5em 0;
    }

    /* 표(Table) 스타일 */
    .novel-capture-area table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0;
      font-size: 0.9em;
    }
    .novel-capture-area th, .novel-capture-area td {
      border: 1px solid var(--novel-bar-color);
      padding: 8px 12px;
    }
    .novel-capture-area th {
      background-color: var(--novel-code-bg);
      font-weight: bold;
    }

    /* 코드블록 서식 */
    .novel-capture-area pre {
      background-color: var(--novel-code-bg);
      padding: 12px 15px;
      border-radius: 6px;
      overflow-x: auto;
      font-family: Consolas, Monaco, 'Andale Mono', monospace;
    }
    .novel-capture-area code { 
      font-family: Consolas, Monaco, 'Andale Mono', monospace; 
      background: var(--novel-code-bg); 
      padding: 2px 6px; 
      border-radius: 4px; 
      font-size: 0.9em; 
    }
    .novel-capture-area pre code {
      background: none;
      padding: 0;
      font-size: 0.9em;
      display: block;
    }
    
    /* 하이라이트 스타일 */
    .novel-capture-area .highlight { 
      background-color: transparent !important;
      color: var(--novel-highlight-text) !important; 
      opacity: 1 !important; 
      padding: 0;
      border-radius: 0;
      cursor: pointer; 
      transition: opacity 0.15s;
    }
    .novel-capture-area .highlight:hover {
      opacity: 0.7 !important;
    }
  </style>
</head>
<body>

  <!-- 좌측 컨트롤 패널 -->
  <div class="control-panel">
    <h2>소설 캡처 설정</h2>
    
    <div>
      <label style="margin-bottom: 5px;">테마 선택</label>
      <div class="flex-row">
        <button class="btn btn-primary" onclick="setTheme('dark')">다크 모드</button>
        <button class="btn btn-secondary" onclick="setTheme('light')">라이트 모드</button>
      </div>
    </div>

    <!-- 행간 조절 버튼 그룹 -->
    <div>
      <label style="margin-bottom: 5px;">행간(줄 간격) 조절</label>
      <div class="flex-row" id="lhGroup">
        <button class="btn btn-lh btn-secondary" style="padding: 8px 0;" onclick="setLineHeight('1.55', this)">1.55</button>
        <button class="btn btn-lh btn-secondary" style="padding: 8px 0;" onclick="setLineHeight('1.7', this)">1.7</button>
        <button class="btn btn-lh btn-primary" style="padding: 8px 0;" onclick="setLineHeight('1.85', this)">1.85</button>
        <button class="btn btn-lh btn-secondary" style="padding: 8px 0;" onclick="setLineHeight('2.0', this)">2.0</button>
      </div>
    </div>

    <!-- 캡처 영역 폭(너비) 조절 (400px ~ 1200px) -->
    <div>
      <div class="flex-row" style="justify-content: space-between;">
        <label>캡처 영역 폭(너비) 조절</label>
        <span id="widthValue" style="font-size: 13px; font-weight: bold; color: #007bff;">500px</span>
      </div>
      <input type="range" id="widthSlider" min="400" max="1200" step="10" value="500" oninput="changeWidth(this.value)">
    </div>

    <!-- 상하 여백 조절 -->
    <div>
      <div class="flex-row" style="justify-content: space-between;">
        <label>상하 여백 조절</label>
        <span id="paddingVValue" style="font-size: 13px; font-weight: bold; color: #007bff;">40px</span>
      </div>
      <input type="range" id="paddingVSlider" min="0" max="100" step="5" value="40" oninput="changePaddingV(this.value)">
    </div>

    <!-- 좌우 여백 조절 -->
    <div>
      <div class="flex-row" style="justify-content: space-between;">
        <label>좌우 여백 조절</label>
        <span id="paddingHValue" style="font-size: 13px; font-weight: bold; color: #007bff;">40px</span>
      </div>
      <input type="range" id="paddingHSlider" min="0" max="100" step="5" value="40" oninput="changePaddingH(this.value)">
    </div>

    <div>
      <label style="margin-bottom: 5px;">텍스트 파일 가져오기 (.txt / .json / .md)</label>
      <input type="file" id="fileInput" accept=".txt,.json,.md" onchange="handleFileUpload()">
    </div>

    <div>
      <label style="margin-bottom: 5px;">단어 치환 (형식: 원본->바꿀단어)</label>
      <textarea id="replaceRules" style="height: 60px;" placeholder="예시)&#10;이름->■■"></textarea>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column;">
      <div class="flex-row" style="justify-content: space-between; margin-bottom: 5px; align-items: center;">
        <label>소설 본문 입력</label>
        <button class="btn" style="width: auto; padding: 4px 10px; font-size: 11px; background: #dc3545; color: white;" onclick="clearAllHighlights()">하이라이트 전체 삭제</button>
      </div>
      
      <div class="guide-box" style="margin-bottom: 8px;">
        • <b># 제목</b>, <b>**볼드**</b>, <b>*이탤릭(색상변경)*</b>, <b>~~취소선~~</b>, <b><u>밑줄</u></b><br>
        • <b>==텍스트==</b> : 글자색 노란색 변경 (드래그 추가 / 클릭 삭제)<br>
        • <b>&gt; 인용구</b>, <b>- 목록</b>, <b>1. 순서목록</b>, <b>- [x] 체크리스트</b><br>
        • <b>[링크](url)</b>, <b>![이미지](url)</b>, <b>| 표 | 작성 |</b><br>
        • <b>`인라인코드`</b> 및 <b>```코드블록```</b> 지원
      </div>
      <textarea id="inputText" style="flex: 1;" placeholder="여기에 소설/마크다운 텍스트를 입력하거나 파일을 업로드하세요..." oninput="renderNovel()"></textarea>
    </div>

    <button class="btn btn-success" onclick="downloadPNG()">고화질 PNG 다운로드</button>
  </div>

  <!-- 우측 실시간 프리뷰 영역 -->
  <div class="preview-container">
    <div class="novel-capture-area" id="novelView" data-theme="dark"></div>
  </div>

  <button id="floatingHighlightBtn" style="position: absolute; display: none; background: #28a745; color: white; border: none; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 9999;">✍️ 하이라이트 추가</button>

  <script>
    // Marked.js 기본 설정 (줄바꿈 자동 적용 & HTML 태그 허용)
    marked.setOptions({
      breaks: true,
      gfm: true
    });

    window.onload = function() {
      document.getElementById('replaceRules').value = "";
      document.getElementById('inputText').value = "";
      renderNovel();
    };

    function setTheme(theme) {
      const novelView = document.getElementById('novelView');
      novelView.setAttribute('data-theme', theme);
    }

    // 행간 설정 함수
    function setLineHeight(lh, selectedBtn) {
      document.getElementById('novelView').style.setProperty('--novel-line-height', lh);
      
      const buttons = document.querySelectorAll('#lhGroup .btn-lh');
      buttons.forEach(btn => {
        btn.classList.remove('btn-primary');
        btn.classList.add('btn-secondary');
      });

      if (selectedBtn) {
        selectedBtn.classList.remove('btn-secondary');
        selectedBtn.classList.add('btn-primary');
      }
    }

    // 너비 조절 함수 (400 ~ 1200px)
    function changeWidth(width) {
      document.getElementById('novelView').style.width = width + 'px';
      document.getElementById('widthValue').innerText = width + 'px';
    }

    // 상하 여백 조절 함수
    function changePaddingV(val) {
      document.getElementById('novelView').style.setProperty('--novel-padding-v', val + 'px');
      document.getElementById('paddingVValue').innerText = val + 'px';
    }

    // 좌우 여백 조절 함수
    function changePaddingH(val) {
      document.getElementById('novelView').style.setProperty('--novel-padding-h', val + 'px');
      document.getElementById('paddingHValue').innerText = val + 'px';
    }

    // 파일 업로드 핸들러
    function handleFileUpload() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const contents = e.target.result;
        if (file.name.endsWith('.json')) {
          try {
            const jsonObj = JSON.parse(contents);
            document.getElementById('inputText').value = jsonObj.content || jsonObj.text || JSON.stringify(jsonObj, null, 2);
          } catch (err) {
            alert('올바른 JSON 형식이 아닙니다.');
          }
        } else {
          document.getElementById('inputText').value = contents;
        }
        renderNovel();
      };
      reader.readAsText(file, 'UTF-8');
    }

    // 빈 줄(엔터) 보존 프리프로세서
    function preprocessBlankLines(rawText) {
      const lines = rawText.split('\n');
      let result = [];
      let inCodeBlock = false;

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i];

        // 코드블록 내부 구분
        if (line.trim().startsWith('```')) {
          inCodeBlock = !inCodeBlock;
          result.push(line);
          continue;
        }

        if (inCodeBlock) {
          result.push(line);
          continue;
        }

        // 코드블록 밖의 빈 줄 처리
        if (line.trim() === '') {
          result.push('<p class="empty-line">&nbsp;</p>');
        } else {
          result.push(line);
        }
      }

      return result.join('\n');
    }

    // 핵심 렌더링 함수
    function renderNovel() {
      let rawText = document.getElementById('inputText').value;
      const replaceRules = document.getElementById('replaceRules').value;
      const novelView = document.getElementById('novelView');

      // 1. 단어 치환 규칙 적용
      const rules = replaceRules.split('\n');
      rules.forEach(rule => {
        if (rule.includes('->')) {
          const [target, replacement] = rule.split('->');
          if (target.trim()) {
            const safeTarget = target.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'); 
            const regex = new RegExp(safeTarget, 'g');
            rawText = rawText.replace(regex, replacement);
          }
        }
      });

      // 2. 입력된 빈 줄(엔터) 보존 처리
      rawText = preprocessBlankLines(rawText);

      // 3. 커스텀 마크다운 문법 프리프로세싱 (하이라이트: ==text==)
      rawText = rawText.replace(/==(.*?)==/g, '<span class="highlight">$1</span>');

      // 4. Marked.js를 사용하여 마크다운 렌더링
      let parsedHtml = marked.parse(rawText);

      novelView.innerHTML = parsedHtml;
    }

    // 캡처 다운로드 함수
    function downloadPNG() {
      const novelView = document.getElementById('novelView');
      renderNovel();

      html2canvas(novelView, {
        scale: 3, 
        useCORS: true,
        backgroundColor: null 
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = '웹소설_캡처_' + new Date().getTime() + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(err => {
        alert('이미지 생성 중 오류가 발생했습니다: ' + err);
      });
    }
    
    document.getElementById('replaceRules').addEventListener('input', renderNovel);

    // 드래그 하이라이트 로직
    const floatBtn = document.getElementById('floatingHighlightBtn');
    const novelView = document.getElementById('novelView');

    novelView.addEventListener('mouseup', function(e) {
      setTimeout(() => {
        const selection = window.getSelection();
        const selectedText = selection.toString().trim();

        if (selectedText.length > 0) {
          const range = selection.getRangeAt(0);
          const rect = range.getBoundingClientRect();

          floatBtn.style.left = `${rect.left + window.pageXOffset + (rect.width / 2) - 60}px`;
          floatBtn.style.top = `${rect.top + window.pageYOffset - 40}px`;
          floatBtn.style.display = 'block';
          floatBtn.dataset.text = selectedText;
        }
      }, 10);
    });

    document.addEventListener('mousedown', function(e) {
      if (e.target !== floatBtn) {
        floatBtn.style.display = 'none';
      }
    });

    floatBtn.addEventListener('click', function() {
      const targetText = this.dataset.text;
      if (!targetText) return;

      const textarea = document.getElementById('inputText');
      let currentContent = textarea.value;

      if (currentContent.includes(targetText)) {
        textarea.value = currentContent.replace(targetText, `==${targetText}==`);
        renderNovel(); 
      } else {
        alert("텍스트 원본과 일치하는 구간을 찾지 못했습니다.\n줄바꿈(엔터)이 여러 개 포함되었는지 확인해 주세요.");
      }

      floatBtn.style.display = 'none';
      window.getSelection().removeAllRanges();
    });

    // 하이라이트 클릭 삭제 로직
    novelView.addEventListener('click', function(e) {
      if (e.target.classList.contains('highlight')) {
        if (window.getSelection().toString().trim().length > 0) return;

        const highlights = Array.from(novelView.querySelectorAll('.highlight'));
        const targetIndex = highlights.indexOf(e.target);

        const textarea = document.getElementById('inputText');
        let content = textarea.value;

        let currentMatchIdx = 0;
        textarea.value = content.replace(/==(.*?)==/g, function(match, p1) {
          if (currentMatchIdx === targetIndex) {
            currentMatchIdx++;
            return p1; 
          }
          currentMatchIdx++;
          return match; 
        });

        renderNovel(); 
      }
    });

    function clearAllHighlights() {
      const textarea = document.getElementById('inputText');
      let content = textarea.value;
      
      textarea.value = content.replace(/==(.*?)==/g, '$1');
      renderNovel();
    }
  </script>
</body>
