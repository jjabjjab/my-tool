<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웹소설 스타일 캡처 생성기</title>
  <!-- 고화질 이미지 저장을 위한 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <!-- Marked.js (더 빠른 jsDelivr CDN 및 다중 예비 CDN 적용) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js" 
          onerror="this.onerror=null; this.src='https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js';"></script>
  <style>
    /* 기본 레이아웃 변수 설정 (라이트/다크 모드 대응) */
    :root {
      --bg-control: #f8f9fa;
      --text-control: #333;
      --border-color: #ced4da;
      
      /* 다크모드 색상 설정 */
      --novel-bg: #141413;
      --novel-text: #FAFAFA;        
      --novel-em-text: #85837E;
      --novel-highlight-text: #ffeb3b; 
      --novel-code-bg: #242423; 
      --novel-bar-color: #3d3d3c; 

      /* 코드블록 변수 */
      --novel-code-box-bg: rgba(255, 255, 255, 0.04);
      --novel-code-header-bg: rgba(255, 255, 255, 0.08);
      
      /* 기본 행간, 여백 및 폰트 설정 */
      --novel-line-height: 1.85;
      --novel-padding-v: 40px;
      --novel-padding-h: 40px;
      --novel-font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    [data-theme="light"] {
      /* 라이트모드 색상 설정 */
      --novel-bg: #FFFFFF;
      --novel-text: #09090B;        
      --novel-em-text: #85837E;
      --novel-highlight-text: #b45309; 
      --novel-code-bg: #f0f0f0; 
      --novel-bar-color: #d1d1d1;        

      /* 코드블록 변수 */
      --novel-code-box-bg: rgba(0, 0, 0, 0.02);
      --novel-code-header-bg: rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; 
      display: flex; 
      height: 100vh; 
      background: #e9ecef; 
    }

    /* 컨트롤 패널 스타일 (좌측) */
    .control-panel { width: 400px; padding: 20px; background: var(--bg-control); color: var(--text-control); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
    h2 { font-size: 18px; margin-bottom: 5px; }
    label { font-size: 13px; font-weight: bold; display: block; }
    textarea, input[type="text"] { width: 100%; border: 1px solid var(--border-color); padding: 10px; border-radius: 4px; font-size: 14px; resize: vertical; }
    
    input[type="range"] { width: 100%; margin-top: 5px; cursor: pointer; }

    .btn { width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; }
    .btn-primary { background: #007bff; color: white; }
    .btn-primary:hover { background: #0056b3; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-secondary:hover { background: #5a6268; }
    .btn-success { background: #28a745; color: white; margin-top: auto; }
    .btn-success:hover { background: #218838; }
    .flex-row { display: flex; gap: 10px; align-items: center; }
    .guide-box { background: #e2e3e5; padding: 10px; border-radius: 4px; font-size: 12px; line-height: 1.5; color: #383d41; }

    /* 커스텀 팔레트 칩 스타일 */
    .palette-chip {
      flex: 1;
      height: 28px;
      border: 1px solid rgba(0, 0, 0, 0.2);
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.1s, outline 0.1s;
      position: relative;
      user-select: none;
    }
    .palette-chip:hover {
      transform: scale(1.05);
    }
    .palette-chip.active {
      outline: 2px solid #007bff;
      outline-offset: 1px;
    }

    /* 프리뷰 영역 스타일 (우측) */
    .preview-container { flex: 1; display: flex; justify-content: center; align-items: start; padding: 20px; overflow-y: auto; background: #555; position: relative; }
    
    /* 실제 웹소설 캡처 구역 */
    .novel-capture-area {
      width: 500px; 
      min-height: 700px;
      background-color: var(--novel-bg);
      padding: var(--novel-padding-v) var(--novel-padding-h); 
      color: var(--novel-text);
      font-size: 17px;
      line-height: var(--novel-line-height); 
      letter-spacing: -0.02em;
      text-align: left; 
      font-family: var(--novel-font-family);
    }

    /* 문단 간격 및 행간 설정 */
    .novel-capture-area p {
      word-break: keep-all;
      overflow-wrap: break-word;
      margin: 0 0 1em 0; 
      color: inherit;
      line-height: var(--novel-line-height);
    }

    .novel-capture-area p:last-child {
      margin-bottom: 0;
    }

    /* 3번 이상 엔터 입력 시 사용되는 빈 줄 높이 */
    .novel-capture-area p.empty-line {
      margin: 0 0 1em 0;
      min-height: calc(1em * var(--novel-line-height));
    }

    /* 헤더 스타일링 */
    .novel-capture-area h1, .novel-capture-area h2, .novel-capture-area h3,
    .novel-capture-area h4, .novel-capture-area h5, .novel-capture-area h6 {
      color: inherit;
      margin-top: 0.8em;
      margin-bottom: 0.4em;
      line-height: 1.3;
      opacity: 1;
      font-family: inherit;
    }
    .novel-capture-area h1 { font-size: 1.8em; }
    .novel-capture-area h2 { font-size: 1.5em; }
    .novel-capture-area h3 { font-size: 1.3em; }
    .novel-capture-area h4 { font-size: 1.15em; }
    .novel-capture-area h5 { font-size: 1em; }
    .novel-capture-area h6 { font-size: 0.85em; }

    /* 블록 요소 상하 여백 */
    .novel-capture-area table,
    .novel-capture-area .code-block-container {
      margin-top: 0.8em;
      margin-bottom: 1em;
    }

    /* 구분선 */
    .novel-capture-area hr {
      border: none;
      border-top: 1px solid var(--novel-bar-color);
      margin: 1.5em 0;
    }

    /* 서식 정의 */
    .novel-capture-area strong { 
      color: inherit; 
      font-weight: 700; 
    }
    
    .novel-capture-area em {
      font-style: normal !important;
      color: var(--novel-em-text) !important;
    }

    .novel-capture-area del {
      color: inherit;
      text-decoration: line-through;
      opacity: 1;
    }

    .novel-capture-area u {
      color: inherit;
      text-decoration: underline;
    }

    .novel-capture-area .low-opacity { 
      color: inherit;
    }
    
    /* 인용구(blockquote) 스타일 */
    .novel-capture-area blockquote { 
      border-left: 4px solid var(--novel-bar-color); 
      padding-left: 15px; 
      margin: 0.8em 0 1em 0;
      color: inherit;
      opacity: 1;
      font-family: inherit;
    }
    .novel-capture-area blockquote p {
      margin-bottom: 0.5em;
    }
    .novel-capture-area blockquote p:last-child {
      margin-bottom: 0;
    }

    /* 링크 및 이미지 */
    .novel-capture-area a {
      color: inherit;
      text-decoration: underline;
    }
    .novel-capture-area img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      margin: 0.5em 0;
    }

    /* 표(Table) 스타일 */
    .novel-capture-area table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0;
      font-size: 0.9em;
      background-color: transparent;
      font-family: inherit;
    }
    .novel-capture-area th, .novel-capture-area td {
      border: 1px solid var(--novel-bar-color);
      padding: 8px 12px;
      color: inherit;
      background-color: transparent;
      font-weight: normal !important;
      font-family: inherit;
    }
    .novel-capture-area th {
      font-weight: normal !important;
    }

    /* 코드블록 전용 커스텀 컨테이너 (제목바 지원) */
    .code-block-container {
      background-color: var(--novel-code-box-bg);
      border: 1px solid var(--novel-bar-color);
      border-radius: 12px;
      overflow: hidden;
      font-family: inherit;
    }
    .code-block-header {
      background-color: var(--novel-code-header-bg);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--novel-bar-color);
      font-size: 14px;
      color: var(--novel-em-text);
    }
    .code-block-title {
      font-weight: 500;
      opacity: 0.85;
    }
    .code-block-copy-btn {
      display: flex;
      align-items: center;
      opacity: 0.6;
      color: inherit;
    }
    .code-block-copy-btn svg {
      width: 16px;
      height: 16px;
    }
    .novel-capture-area pre {
      background-color: transparent !important;
      padding: 14px 16px;
      margin: 0;
      border-radius: 0;
      font-family: inherit !important;
      color: inherit;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-wrap: break-word;
    }
    .novel-capture-area :not(pre) > code {
      font-family: inherit !important;
      background: var(--novel-code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
      color: inherit;
    }
    .novel-capture-area pre code {
      background: none !important;
      padding: 0 !important;
      font-size: 0.95em;
      display: block;
      color: inherit;
      font-family: inherit !important;
    }
    
    /* 하이라이트 스타일 */
    .novel-capture-area .highlight { 
      background-color: transparent !important;
      color: var(--novel-highlight-text) !important; 
      opacity: 1 !important; 
      padding: 0;
      border-radius: 0;
      cursor: pointer; 
      transition: opacity 0.15s, color 0.15s;
    }
    .novel-capture-area .highlight:hover {
      opacity: 0.7 !important;
    }
  </style>
</head>
<body>

  <!-- 좌측 컨트롤 패널 -->
  <div class="control-panel">
    <h2>소설 캡처 설정</h2>
    
    <div>
      <label style="margin-bottom: 5px;">테마 선택</label>
      <div class="flex-row">
        <button class="btn btn-primary" onclick="setTheme('dark')">다크 모드</button>
        <button class="btn btn-secondary" onclick="setTheme('light')">라이트 모드</button>
      </div>
    </div>

    <!-- 로컬 폰트 전용 설정 섹션 -->
    <div>
      <label style="margin-bottom: 5px;">폰트 설정 (로컬 폰트)</label>
      <input type="text" id="customFontInput" placeholder="PC 폰트명 입력 (예: KoPubWorld바탕, 리디바탕)" oninput="applyLocalFontName(this.value)" style="margin-bottom: 6px;">
      
      <div style="font-size: 11px; color: #666; margin-bottom: 3px;">또는 폰트 파일 직접 업로드 (.ttf / .otf / .woff)</div>
      <input type="file" id="fontFileInput" accept=".ttf,.otf,.woff,.woff2" onchange="handleFontFileUpload()" style="font-size: 12px; padding: 6px;">
    </div>

    <!-- 커스텀 팔레트 섹션 -->
    <div>
      <div class="flex-row" style="justify-content: space-between; margin-bottom: 6px;">
        <label>하이라이트 팔레트 <span style="font-weight: normal; font-size: 11px; color: #666;">(클릭: 선택 / 더블클릭: 변경)</span></label>
        <button type="button" onclick="resetPalette()" style="font-size: 11px; padding: 2px 8px; background: #6c757d; color: white; border: none; border-radius: 3px; cursor: pointer;">초기화</button>
      </div>
      <div class="flex-row" style="gap: 5px;" id="paletteContainer"></div>
    </div>

    <!-- 행간 조절 버튼 그룹 -->
    <div>
      <label style="margin-bottom: 5px;">행간(줄 간격) 조절</label>
      <div class="flex-row" id="lhGroup">
        <button class="btn btn-lh btn-secondary" style="padding: 8px 0;" onclick="setLineHeight('1.55', this)">1.55</button>
        <button class="btn btn-lh btn-secondary" style="padding: 8px 0;" onclick="setLineHeight('1.7', this)">1.7</button>
        <button class="btn btn-lh btn-primary" style="padding: 8px 0;" onclick="setLineHeight('1.85', this)">1.85</button>
        <button class="btn btn-lh btn-secondary" style="padding: 8px 0;" onclick="setLineHeight('2.0', this)">2.0</button>
      </div>
    </div>

    <!-- 캡처 영역 폭(너비) 조절 -->
    <div>
      <div class="flex-row" style="justify-content: space-between;">
        <label>캡처 영역 폭(너비) 조절</label>
        <span id="widthValue" style="font-size: 13px; font-weight: bold; color: #007bff;">500px</span>
      </div>
      <input type="range" id="widthSlider" min="400" max="1200" step="10" value="500" oninput="changeWidth(this.value)">
    </div>

    <!-- 상하 여백 조절 -->
    <div>
      <div class="flex-row" style="justify-content: space-between;">
        <label>상하 여백 조절</label>
        <span id="paddingVValue" style="font-size: 13px; font-weight: bold; color: #007bff;">40px</span>
      </div>
      <input type="range" id="paddingVSlider" min="0" max="100" step="5" value="40" oninput="changePaddingV(this.value)">
    </div>

    <!-- 좌우 여백 조절 -->
    <div>
      <div class="flex-row" style="justify-content: space-between;">
        <label>좌우 여백 조절</label>
        <span id="paddingHValue" style="font-size: 13px; font-weight: bold; color: #007bff;">40px</span>
      </div>
      <input type="range" id="paddingHSlider" min="0" max="100" step="5" value="40" oninput="changePaddingH(this.value)">
    </div>

    <div>
      <label style="margin-bottom: 5px;">텍스트 파일 가져오기 (.txt / .json / .md)</label>
      <input type="file" id="fileInput" accept=".txt,.json,.md" onchange="handleFileUpload()">
    </div>

    <div>
      <label style="margin-bottom: 5px;">단어 치환 (형식: 원본->바꿀단어)</label>
      <textarea id="replaceRules" style="height: 60px;" placeholder="예시)&#10;이름->■■"></textarea>
    </div>

    <!-- 소설 본문 입력 구역 -->
    <div style="display: flex; flex-direction: column; flex: 1;">
      <div class="flex-row" style="justify-content: space-between; margin-bottom: 5px; align-items: center;">
        <label>소설 본문 입력</label>
        <button class="btn" style="width: auto; padding: 4px 10px; font-size: 11px; background: #dc3545; color: white;" onclick="clearAllHighlights()">하이라이트 전체 삭제</button>
      </div>
      
      <div class="guide-box" style="margin-bottom: 8px;">
        • <b># 제목</b>, <b>**볼드**</b>, <b>*이탤릭(색상변경)*</b>, <b>~~취소선~~</b>, <b>++밑줄++</b><br>
        • <b>==텍스트==</b> : 하이라이트 글자색 변경 (드래그 추가 / 클릭 삭제)<br>
        • <b>&gt; 인용구</b>, <b>[링크](url)</b>, <b>![이미지](url)</b>, <b>| 표 | 작성 |</b><br>
        • <b>`인라인코드`</b> 및 <b>```제목``` 코드블록</b> 지원
      </div>
      
      <textarea id="inputText" style="min-height: 50vh; flex: 1;" placeholder="여기에 소설/마크다운 텍스트를 입력하거나 파일을 업로드하세요..." oninput="renderNovel()"></textarea>
    </div>

    <button class="btn btn-success" onclick="downloadPNG()">고화질 PNG 다운로드</button>
  </div>

  <!-- 우측 실시간 프리뷰 영역 -->
  <div class="preview-container">
    <div class="novel-capture-area" id="novelView" data-theme="dark"></div>
  </div>

  <button id="floatingHighlightBtn" style="position: absolute; display: none; background: #28a745; color: white; border: none; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 9999;">✍️ 하이라이트 추가</button>

  <script>
    const DEFAULT_PALETTE = ['#ffeb3b', '#00f2fe', '#ff758c', '#ff9f43', '#a8ff78', '#b45309'];
    let currentPalette = [];
    let selectedChipIdx = 0;

    window.onload = function() {
      document.getElementById('replaceRules').value = "";
      document.getElementById('inputText').value = "";
      initPalette();
      initFont();
      
      // 라이브러리가 완전히 준비될 때까지 안전 대기
      ensureMarkedLoaded().then(() => {
        renderNovel();
      });
    };

    // 라이브러리 비동기 로딩 보장 함수
    function ensureMarkedLoaded() {
      return new Promise((resolve) => {
        if (typeof marked !== 'undefined') {
          resolve();
          return;
        }
        let attempts = 0;
        const interval = setInterval(() => {
          attempts++;
          if (typeof marked !== 'undefined') {
            clearInterval(interval);
            resolve();
          } else if (attempts > 30) { // 3초 초과 시 해제
            clearInterval(interval);
            resolve();
          }
        }, 100);
      });
    }

    function initFont() {
      const savedType = localStorage.getItem('webnovel_font_type');
      const savedVal = localStorage.getItem('webnovel_font_val');
      const savedInputVal = localStorage.getItem('webnovel_font_input_val');

      if (savedInputVal) {
        document.getElementById('customFontInput').value = savedInputVal;
      }

      if (savedType === 'uploaded' && savedVal) {
        loadFontFromDataUrl('CustomUploadedFont_Saved', savedVal);
      } else if (savedType === 'name' && savedVal) {
        applyLocalFontName(savedVal, false);
      }
    }

    function applyLocalFontName(fontName, updateStorage = true) {
      const name = fontName.trim();
      const novelView = document.getElementById('novelView');

      if (!name) {
        const defaultFont = '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
        novelView.style.setProperty('--novel-font-family', defaultFont);
        if (updateStorage) {
          localStorage.removeItem('webnovel_font_type');
          localStorage.removeItem('webnovel_font_val');
          localStorage.removeItem('webnovel_font_input_val');
        }
        return;
      }

      const fontFamilyStr = `"${name}", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
      novelView.style.setProperty('--novel-font-family', fontFamilyStr);

      if (updateStorage) {
        localStorage.setItem('webnovel_font_type', 'name');
        localStorage.setItem('webnovel_font_val', name);
        localStorage.setItem('webnovel_font_input_val', name);
      }
    }

    function handleFontFileUpload() {
      const fileInput = document.getElementById('fontFileInput');
      const file = fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const dataUrl = e.target.result;
        const fontName = 'CustomUploadedFont_' + Date.now();
        loadFontFromDataUrl(fontName, dataUrl, file.name);
      };
      reader.readAsDataURL(file);
    }

    function loadFontFromDataUrl(fontName, dataUrl, fileName = '') {
      const fontFace = new FontFace(fontName, `url(${dataUrl})`);
      fontFace.load().then(function(loadedFace) {
        document.fonts.add(loadedFace);
        document.getElementById('novelView').style.setProperty('--novel-font-family', `"${fontName}", -apple-system, sans-serif`);
        
        const displayName = fileName ? fileName.replace(/\.[^/.]+$/, "") : (document.getElementById('customFontInput').value || "업로드된 폰트");
        document.getElementById('customFontInput').value = displayName;

        try {
          localStorage.setItem('webnovel_font_type', 'uploaded');
          localStorage.setItem('webnovel_font_val', dataUrl);
          localStorage.setItem('webnovel_font_input_val', displayName);
        } catch(e) {
          console.warn('폰트 파일 용량이 커서 저장되지 않았습니다.');
        }
      }).catch(function(err) {
        alert('폰트 파일을 로드하는 중 오류가 발생했습니다: ' + err);
      });
    }

    function initPalette() {
      const saved = localStorage.getItem('webnovel_palette_colors');
      if (saved) {
        try {
          currentPalette = JSON.parse(saved);
        } catch(e) {
          currentPalette = [...DEFAULT_PALETTE];
        }
      } else {
        currentPalette = [...DEFAULT_PALETTE];
      }
      renderPaletteUI();
      selectPaletteColor(0);
    }

    function savePalette() {
      localStorage.setItem('webnovel_palette_colors', JSON.stringify(currentPalette));
    }

    function renderPaletteUI() {
      const container = document.getElementById('paletteContainer');
      container.innerHTML = '';

      currentPalette.forEach((color, idx) => {
        const chip = document.createElement('div');
        chip.className = 'palette-chip' + (idx === selectedChipIdx ? ' active' : '');
        chip.style.backgroundColor = color;
        chip.title = `팔레트 ${idx + 1} (클릭: 선택 / 더블클릭: 색상변경)`;

        const hiddenPicker = document.createElement('input');
        hiddenPicker.type = 'color';
        hiddenPicker.value = color;
        hiddenPicker.style.position = 'absolute';
        hiddenPicker.style.opacity = '0';
        hiddenPicker.style.width = '1px';
        hiddenPicker.style.height = '1px';
        hiddenPicker.style.pointerEvents = 'none';

        hiddenPicker.addEventListener('change', (e) => {
          updatePaletteColor(idx, e.target.value);
        });

        chip.appendChild(hiddenPicker);

        let clickTimer = null;

        chip.addEventListener('click', (e) => {
          if (clickTimer) clearTimeout(clickTimer);
          clickTimer = setTimeout(() => {
            selectPaletteColor(idx);
          }, 200);
        });

        chip.addEventListener('dblclick', (e) => {
          if (clickTimer) clearTimeout(clickTimer);
          e.stopPropagation();
          
          if (typeof hiddenPicker.showPicker === 'function') {
            hiddenPicker.showPicker();
          } else {
            hiddenPicker.click();
          }
        });

        container.appendChild(chip);
      });
    }

    function selectPaletteColor(idx) {
      selectedChipIdx = idx;
      const color = currentPalette[idx];
      document.getElementById('novelView').style.setProperty('--novel-highlight-text', color);

      const chips = document.querySelectorAll('#paletteContainer .palette-chip');
      chips.forEach((c, i) => {
        if (i === idx) c.classList.add('active');
        else c.classList.remove('active');
      });
    }

    function updatePaletteColor(idx, newColor) {
      currentPalette[idx] = newColor;
      savePalette();
      renderPaletteUI();
      selectPaletteColor(idx);
    }

    function resetPalette() {
      currentPalette = [...DEFAULT_PALETTE];
      savePalette();
      renderPaletteUI();
      selectPaletteColor(0);
    }

    function setTheme(theme) {
      const novelView = document.getElementById('novelView');
      novelView.setAttribute('data-theme', theme);
      selectPaletteColor(selectedChipIdx);
    }

    function setLineHeight(lh, selectedBtn) {
      document.getElementById('novelView').style.setProperty('--novel-line-height', lh);
      
      const buttons = document.querySelectorAll('#lhGroup .btn-lh');
      buttons.forEach(btn => {
        btn.classList.remove('btn-primary');
        btn.classList.add('btn-secondary');
      });

      if (selectedBtn) {
        selectedBtn.classList.remove('btn-secondary');
        selectedBtn.classList.add('btn-primary');
      }
    }

    function changeWidth(width) {
      document.getElementById('novelView').style.width = width + 'px';
      document.getElementById('widthValue').innerText = width + 'px';
    }

    function changePaddingV(val) {
      document.getElementById('novelView').style.setProperty('--novel-padding-v', val + 'px');
      document.getElementById('paddingVValue').innerText = val + 'px';
    }

    function changePaddingH(val) {
      document.getElementById('novelView').style.setProperty('--novel-padding-h', val + 'px');
      document.getElementById('paddingHValue').innerText = val + 'px';
    }

    function handleFileUpload() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const contents = e.target.result;
        if (file.name.endsWith('.json')) {
          try {
            const jsonObj = JSON.parse(contents);
            document.getElementById('inputText').value = jsonObj.content || jsonObj.text || JSON.stringify(jsonObj, null, 2);
          } catch (err) {
            alert('올바른 JSON 형식이 아닙니다.');
          }
        } else {
          document.getElementById('inputText').value = contents;
        }
        renderNovel();
      };
      reader.readAsText(file, 'UTF-8');
    }

    function preprocessBlankLines(rawText) {
      const parts = rawText.split(/(```[\s\S]*?```)/g);
      return parts.map((part, index) => {
        if (index % 2 === 1) return part;
        
        return part.replace(/\n{3,}/g, (match) => {
          const count = match.length - 2;
          let emptyLines = '';
          for (let i = 0; i < count; i++) {
            emptyLines += '<p class="empty-line">&nbsp;</p>\n\n';
          }
          return '\n\n' + emptyLines;
        });
      }).join('');
    }

    function disarmLists(rawText) {
      const parts = rawText.split(/(```[\s\S]*?```)/g);
      return parts.map((part, index) => {
        if (index % 2 === 1) return part; 
        
        return part.split('\n').map(line => {
          let processed = line.replace(/^(\s*)([-*+]|\d+\.)(\s+)/, '$1&#8203;$2$3');
          processed = processed.replace(/^( +)/, (match) => '&nbsp;'.repeat(match.length));
          return processed;
        }).join('\n');
      }).join('');
    }

    // 렌더링 함수
    function renderNovel() {
      let rawText = document.getElementById('inputText').value;
      const replaceRules = document.getElementById('replaceRules').value;
      const novelView = document.getElementById('novelView');

      if (typeof marked === 'undefined') {
        novelView.innerHTML = '<p style="color:#ff4d4d; font-weight:bold;">⚠️ 마크다운 라이브러리를 불러오지 못했습니다. 인터넷 연결 상태를 확인해 주세요.</p>';
        return;
      }

      // 커스텀 코드블록 렌더러 정의
      const customRenderer = new marked.Renderer();
      customRenderer.code = function(code, infostring, isEscaped) {
        const title = (infostring || '').trim();
        const escapedCode = code
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');

        const copySvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;

        if (title) {
          return `<div class="code-block-container">
            <div class="code-block-header">
              <span class="code-block-title">${title}</span>
              <span class="code-block-copy-btn">${copySvg}</span>
            </div>
            <pre><code>${escapedCode}</code></pre>
          </div>\n`;
        } else {
          return `<div class="code-block-container">
            <pre><code>${escapedCode}</code></pre>
          </div>\n`;
        }
      };

      if (typeof marked.use === 'function') {
        marked.use({ breaks: true, gfm: true, renderer: customRenderer });
      } else if (typeof marked.setOptions === 'function') {
        marked.setOptions({ breaks: true, gfm: true, renderer: customRenderer });
      }

      // 1. 단어 치환 규칙 적용
      const rules = replaceRules.split('\n');
      rules.forEach(rule => {
        if (rule.includes('->')) {
          const [target, replacement] = rule.split('->');
          if (target.trim()) {
            const safeTarget = target.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'); 
            const regex = new RegExp(safeTarget, 'g');
            rawText = rawText.replace(regex, replacement);
          }
        }
      });

      // 2. 3연속 이상 빈 줄 전처리
      rawText = preprocessBlankLines(rawText);

      // 3. 리스트 문법 무력화 전처리
      rawText = disarmLists(rawText);

      // 4. 간편 밑줄 문법 미리 변환 (++내용++ -> <u>내용</u>)
      rawText = rawText.replace(/\+\+(.*?)\+\+/g, '<u>$1</u>');

      // 5. 커스텀 하이라이트 문법 미리 변환
      rawText = rawText.replace(/==(.*?)==/g, '<span class="highlight">$1</span>');

      // 6. 마크다운 파싱 수행
      let parsedHtml = typeof marked.parse === 'function' ? marked.parse(rawText) : marked(rawText);

      novelView.innerHTML = parsedHtml;
    }

    function convertColorSrgbToRgb(colorStr) {
      if (!colorStr || typeof colorStr !== 'string') return colorStr;
      return colorStr.replace(/color\(srgb\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)(?:\s*\/\s*([\d.]+))?\)/g, (m, r, g, b, a) => {
        const red = Math.round(parseFloat(r) * 255);
        const green = Math.round(parseFloat(g) * 255);
        const blue = Math.round(parseFloat(b) * 255);
        if (a !== undefined) {
          return `rgba(${red}, ${green}, ${blue}, ${a})`;
        }
        return `rgb(${red}, ${green}, ${blue})`;
      });
    }

    function downloadPNG() {
      const novelView = document.getElementById('novelView');
      renderNovel();

      html2canvas(novelView, {
        scale: 3, 
        useCORS: true,
        backgroundColor: null,
        onclone: function(clonedDoc) {
          const target = clonedDoc.getElementById('novelView');
          if (!target) return;

          const elements = [target, ...Array.from(target.querySelectorAll('*'))];
          const props = ['color', 'backgroundColor', 'borderColor', 'outlineColor', 'borderTopColor', 'borderRightColor', 'borderBottomColor', 'borderLeftColor'];
          
          elements.forEach(el => {
            const style = window.getComputedStyle(el);
            props.forEach(prop => {
              const val = style[prop];
              if (val && val.includes('color(')) {
                el.style[prop] = convertColorSrgbToRgb(val);
              }
            });
          });
        }
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = '웹소설_캡처_' + new Date().getTime() + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(err => {
        alert('이미지 생성 중 오류가 발생했습니다: ' + err);
      });
    }
    
    document.getElementById('replaceRules').addEventListener('input', renderNovel);

    const floatBtn = document.getElementById('floatingHighlightBtn');
    const novelView = document.getElementById('novelView');

    novelView.addEventListener('mouseup', function(e) {
      setTimeout(() => {
        const selection = window.getSelection();
        const selectedText = selection.toString().trim();

        if (selectedText.length > 0) {
          const range = selection.getRangeAt(0);
          const rect = range.getBoundingClientRect();

          floatBtn.style.left = `${rect.left + window.pageXOffset + (rect.width / 2) - 60}px`;
          floatBtn.style.top = `${rect.top + window.pageYOffset - 40}px`;
          floatBtn.style.display = 'block';
          floatBtn.dataset.text = selectedText;
        }
      }, 10);
    });

    document.addEventListener('mousedown', function(e) {
      if (e.target !== floatBtn) {
        floatBtn.style.display = 'none';
      }
    });

    floatBtn.addEventListener('click', function() {
      const targetText = this.dataset.text;
      if (!targetText) return;

      const textarea = document.getElementById('inputText');
      let currentContent = textarea.value;

      if (currentContent.includes(targetText)) {
        textarea.value = currentContent.replace(targetText, `==${targetText}==`);
        renderNovel(); 
      } else {
        alert("텍스트 원본과 일치하는 구간을 찾지 못했습니다.\n줄바꿈(엔터)이 여러 개 포함되었는지 확인해 주세요.");
      }

      floatBtn.style.display = 'none';
      window.getSelection().removeAllRanges();
    });

    novelView.addEventListener('click', function(e) {
      if (e.target.classList.contains('highlight')) {
        if (window.getSelection().toString().trim().length > 0) return;

        const highlights = Array.from(novelView.querySelectorAll('.highlight'));
        const targetIndex = highlights.indexOf(e.target);

        const textarea = document.getElementById('inputText');
        let content = textarea.value;

        let currentMatchIdx = 0;
        textarea.value = content.replace(/==(.*?)==/g, function(match, p1) {
          if (currentMatchIdx === targetIndex) {
            currentMatchIdx++;
            return p1; 
          }
          currentMatchIdx++;
          return match; 
        });

        renderNovel(); 
      }
    });

    function clearAllHighlights() {
      const textarea = document.getElementById('inputText');
      let content = textarea.value;
      
      textarea.value = content.replace(/==(.*?)==/g, '$1');
      renderNovel();
    }
  </script>
